name: Control audit

# The fourth tier, and the one that asks a different question from the other three.
#
# `ci.yml` asks "is this change correct?". `production-smoke.yml` asks "is the live
# store working?". Neither can ask "are the controls we believe in actually there?" —
# they *are* the controls, and a control cannot be the evidence for itself.
#
# Six times now this repository has shipped something that reported one thing and did
# another (ADRs 004, 006, 010, 011, 015, 016). Each was found by a human reading code.
# This workflow is where that reading is done automatically, on a schedule, of
# everything named in `docs/controls.json`.
#
# See docs/adr/018-a-claim-about-a-control-is-not-a-control.md.
#
# ─────────────────────────────────────────────────────────────────────────────
# THIS WORKFLOW CANNOT RUN UNTIL IT IS ON THE DEFAULT BRANCH.
#
# Scheduled runs execute only from the default branch, and `workflow_dispatch` needs
# the file there before the button appears. While this lives on a feature branch it is
# not failing — it does not exist as far as the Actions API is concerned. A merge-order
# fact, not a misconfiguration. The same note sits at the top of production-smoke.yml
# for the same reason.
# ─────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
  schedule:
    # Every 6 hours, matching production-smoke's cadence because the smoke-liveness
    # probe measures that workflow and a monitor slower than what it monitors reports
    # yesterday's news. src/tests/unit/heartbeat-window.test.ts holds the two in step.
    - cron: '20 */6 * * *'

concurrency:
  group: control-audit
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  # Reading branch protection needs administration:read, which a workflow token cannot
  # be granted — `permissions:` cannot widen the GITHUB_TOKEN beyond the repository
  # scopes GitHub allows. So the merge-gate probe will report `unevaluable` here unless
  # CONTROL_AUDIT_TOKEN (a PAT with administration:read) is set. That is deliberately
  # visible rather than silently absent: an unevaluable probe says so, and never
  # reports `absent` on a permission problem. See ADR 010's separation of "failed" from
  # "could not run".
  checks: read
  actions: read

# GitHub's Linux default is `bash -e {0}` — no pipefail — so a piped step reports the
# exit status of `tee` rather than of the script that mattered. Two steps in
# production-smoke.yml shipped that way and neither could fail. Declared at workflow
# scope so a step nobody has written yet inherits the fix.
# See docs/adr/010-a-control-that-cannot-fail.md.
defaults:
  run:
    shell: bash

jobs:
  audit:
    name: Audit the controls this repository claims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      # No `pnpm install`. Every probe here is dependency-free and uses Node 22's global
      # fetch, so this job cannot be broken by a dependency change the merge gate has
      # not seen yet — the same property that keeps production-smoke.yml independent.

      - name: Merge gate — is main actually protected?
        id: merge-gate
        continue-on-error: true
        env:
          # Falls back to the workflow token, which cannot read protection settings and
          # will correctly report `unevaluable` rather than guessing `absent`.
          GITHUB_TOKEN: ${{ secrets.CONTROL_AUDIT_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/probe-branch-protection.mjs 2>&1 | tee merge-gate.log

      # Its own label, its own issue. `merge-gate-dark` says the checks did not execute;
      # this says they executed and nothing required them. Two different facts down one
      # channel is a channel people learn to mute (ADR 011), and these two are the pair
      # most easily confused — both are "the gate did not stop it".
      - name: Report an unenforced merge gate
        # `always() &&` is load-bearing, not decoration. An `if:` naming no status function
        # has `success()` ANDed onto it, which would make this alarm depend on every earlier
        # step having passed rather than on what it actually asks. Third recurrence of that
        # bug in this repository — see docs/adr/027.
        if: always() && steps.merge-gate.outcome != 'skipped'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const label = 'merge-gate-unenforced'
            const title = 'Nothing requires the checks that run on main'
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`

            // Read the probe's own output as data. Scraping its prose would mean this
            // alarm goes quiet the day somebody rewords a sentence.
            let probe
            try {
              probe = JSON.parse(fs.readFileSync('merge-gate.json', 'utf-8'))
            } catch {
              // No verdict is not a finding about branch protection. The audit summary
              // below still carries the step's outcome.
              return
            }

            if (!probe?.escalation?.escalate) return

            const REASONS = {
              'stale-acceptance': [
                '`main` has no branch protection, and the decision to accept that has not',
                'been restated inside the window the registry allows.',
              ],
              'precondition-met': [
                '`main` has no branch protection, and the one blocker that was recorded',
                'against enabling it is gone.',
              ],
            }

            const body = [
              ...(REASONS[probe.escalation.reason] ?? ['`main` has no branch protection.']),
              '',
              probe.escalation.detail,
              '',
              '**This is not the same finding as `merge-gate-dark`.** That one says the',
              'checks did not execute. This one says they executed, reported, and bound',
              'nothing — the merge button on this repository is the deploy button, with no',
              'check standing between them.',
              '',
              '**What a human does about it**',
              '',
              probe.humanAction ?? 'See docs/controls.json, control `merge-gate`.',
              '',
              'If the answer is that the gap is still a deliberate choice, that is a valid',
              'answer — record it by updating `acceptedSince` and `acceptedWhy` in',
              '`docs/controls.json`, and this issue closes itself the day protection is on.',
              '',
              `Run: ${runUrl}`,
              '',
              'See `docs/adr/015-a-gate-that-was-only-ever-documented.md` and',
              '`docs/adr/018-a-claim-about-a-control-is-not-a-control.md`.',
            ].join('\n')

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            })

            // One issue, updated — never one per run. ADR 011.
            if (open.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              })
              return
            }

            const issue = open[0]
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100,
            })
            const last = comments[comments.length - 1]
            const withoutRun = (text) => text.replace(/Run: \S+/g, '').trim()
            if (last && withoutRun(last.body) === withoutRun(body)) return // nothing new to say

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body,
            })

      # And close it when protection is actually on, so the label means what it says.
      - name: Close the unenforced-gate issue when protection appears
        # Same ADR 027 reasoning as above.
        if: always() && steps.merge-gate.outcome != 'skipped'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const label = 'merge-gate-unenforced'

            let probe
            try {
              probe = JSON.parse(fs.readFileSync('merge-gate.json', 'utf-8'))
            } catch {
              return
            }

            // Only `enforced` closes it. An `unevaluable` verdict means the probe could not
            // read the setting, which is not evidence that the gate appeared — closing on it
            // would turn an expired token into a clean bill of health (ADR 010).
            if (probe.verdict !== 'enforced') return

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            })

            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `\`main\` now requires: ${(probe.observedContexts ?? []).join(', ')}. Closing.`,
              })
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              })
            }

      # Every accepted gap, not just the merge gate's.
      #
      # This check used to live in `control-registry.test.ts`, inside the merge gate, and
      # on 2026-09-15 it turned every pull request in the repository red — including two
      # dependabot PRs whose contents had nothing to do with it — because
      # `smoke-secret-isolation` had turned 31 days old at midnight UTC. A wall-clock event
      # is not caused by the change in front of you, so blocking that change reaches the one
      # person who cannot act on it. Same trade as the credential audit in ci.yml and as
      # premise drift (ADR 008): report prominently, never block. See docs/adr/029.
      #
      # Its own label. `merge-gate-unenforced` above says branch protection is absent; this
      # says an acceptance has stopped being restated. Both can be true of `merge-gate` at
      # once and neither implies the other, and `smoke-secret-isolation` can only ever
      # trigger this one. Two facts down one channel is a channel people mute (ADR 011).
      - name: Accepted gaps — is any of them being forgotten?
        id: accepted-gap
        continue-on-error: true
        run: node scripts/probe-accepted-gap.mjs 2>&1 | tee accepted-gap.log

      # A transport, not a decision. Every sentence in the issue is composed by
      # `composeBody()` in the probe, where a test can read it — the smoke workflow's
      # equivalent logic lives in a YAML string and shipped a comparison that could not
      # match for 124 consecutive runs. See docs/adr/030.
      - name: Report a forgotten acceptance
        # `always() &&` is load-bearing: an `if:` naming no status function has `success()`
        # ANDed onto it, which would make this alarm depend on every earlier step having
        # passed rather than on what it actually asks (ADR 027).
        if: always() && steps.accepted-gap.outcome != 'skipped'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')

            let probe
            try {
              probe = JSON.parse(fs.readFileSync('accepted-gap.json', 'utf-8'))
            } catch {
              // No verdict is not a finding about acceptances. The audit summary below
              // still carries the step's outcome.
              return
            }

            if (!probe?.escalate || !probe.body) return

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: probe.label,
            })

            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`
            const body = `${probe.body}\n\nRun: ${runUrl}`

            if (open.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: probe.title,
                body,
                labels: [probe.label],
              })
              return
            }

            // Update in place rather than commenting. The finding is a current-state
            // report, not an event log — a new comment every six hours is how issue #24
            // reached 99 of them (ADR 011).
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: open[0].number,
              body,
            })

      # And close it once every acceptance is inside the window again, so the label keeps
      # meaning what it says.
      - name: Close the forgotten-acceptance issue on recovery
        if: always() && steps.accepted-gap.outcome != 'skipped'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')

            let probe
            try {
              probe = JSON.parse(fs.readFileSync('accepted-gap.json', 'utf-8'))
            } catch {
              return
            }

            // `escalate: false` with an empty `aged` list would mean the probe found no
            // accepted gaps at all, which is a registry problem rather than a recovery —
            // closing on it would report an all-clear the probe never gave (ADR 010).
            if (probe.escalate || !Array.isArray(probe.aged) || probe.aged.length === 0) return

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: probe.label,
            })

            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `${probe.detail} Closing.`,
              })
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              })
            }

      # Twelve invariants broken on purpose, one at a time, to check that the tests
      # protecting them still go red. See docs/adr/020.
      #
      # `continue-on-error` for the same reason the merge-gate probe has it: a dead
      # assertion is a health finding, not a reason to fail a scheduled audit that also
      # carries other results. The summary below reports it either way.
      #
      # Vitest sentinels only. The two Playwright ones each need a production build, and
      # this job installs no dependencies on purpose — adding them would make the audit
      # breakable by a dependency change the merge gate has not seen yet, which is the
      # property that keeps this tier independent. Run them by hand with
      # `--with-e2e` when the sentinel set changes.
      - name: Assertion liveness — can these tests still fail?
        id: liveness
        continue-on-error: true
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          node scripts/probe-assertion-liveness.mjs 2>&1 | tee liveness.log

      # Its own label, its own issue — and until 2026-09-21 it had neither.
      #
      # This step is `continue-on-error: true`, and its only trace was one `failure` cell
      # in the job summary at the bottom. So when the probe began refusing to start — the
      # steps above write `merge-gate.log` and `accepted-gap.log` into the workspace, and
      # `git status --porcelain` counts an untracked file as a dirty tree — it failed on
      # every scheduled run and told nobody. The control that exists to find tests which
      # cannot fail was itself a check that could not report.
      #
      # `continue-on-error` on the reporter too: a notification problem must never mask or
      # manufacture a result. Same trade as the two reporters below it.
      - name: Report dead or unrunnable assertions
        # `always() &&` is load-bearing. An `if:` naming no status function has `success()`
        # ANDed onto it by GitHub, which would make this ask "did every earlier step pass,
        # AND did liveness fail?" — a question about execution wearing the clothes of a
        # question about configuration. See ADR 027.
        #
        # Both this and the recovery step below run on `always()` and hand the outcome to
        # the decision, rather than each carrying half of it in their own `if:`. The
        # decision is in scripts/lib/liveness-report.mjs; this block is transport.
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const lib = `file://${process.env.GITHUB_WORKSPACE}/scripts/lib/liveness-report.mjs`
            const { livenessIssuePlan, LIVENESS_ISSUE_LABEL, LIVENESS_ISSUE_TITLE } =
              await import(lib)

            const repo = { owner: context.repo.owner, repo: context.repo.repo }
            const runUrl = `${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${context.runId}`

            let log = null
            try { log = fs.readFileSync('liveness.log', 'utf-8') } catch { /* absence is not a finding */ }

            const { data: openIssues } = await github.rest.issues.listForRepo({
              ...repo, state: 'open', labels: LIVENESS_ISSUE_LABEL,
            })
            const comments = openIssues.length
              ? await github.paginate(github.rest.issues.listComments, {
                  ...repo, issue_number: openIssues[0].number, per_page: 100,
                })
              : []

            const plan = livenessIssuePlan({
              outcome: '${{ steps.liveness.outcome }}', log, openIssues, comments, runUrl,
            })

            for (const issue_number of plan.close) {
              await github.rest.issues.createComment({ ...repo, issue_number, body: plan.closeComment })
              await github.rest.issues.update({ ...repo, issue_number, state: 'closed', state_reason: 'completed' })
            }
            if (plan.create) {
              await github.rest.issues.create({
                ...repo, title: LIVENESS_ISSUE_TITLE, body: plan.body, labels: [LIVENESS_ISSUE_LABEL],
              })
            }
            if (plan.comment !== null) {
              await github.rest.issues.createComment({ ...repo, issue_number: plan.comment, body: plan.body })
            }

      # Is anything still looking at production?
      #
      # Separate from production-smoke's own failure channel on purpose. That one says
      # "the store is broken"; this one says "we have not looked at the store since the
      # 15th". Those are different facts, and issue #24's 32 comments are what happens
      # when one channel carries both.
      - name: Production verification liveness — is anything still looking?
        id: smoke-liveness
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/probe-smoke-liveness.mjs 2>&1 | tee smoke-liveness.log

      # Its own label, its own issue.
      #
      # `continue-on-error` so a notification problem can never mask or manufacture a
      # result — the same trade production-smoke.yml makes for its reporter.
      - name: Report a dark verification tier
        # `always() &&` is load-bearing, not decoration. An `if:` naming no status
        # function has `success()` ANDed onto it by GitHub, so this once asked "did
        # everything before me succeed, AND is the tier dark?" — and the alarm about
        # dark alarms would itself go dark the moment any earlier step failed. It
        # worked only because every step above sets `continue-on-error`, which is a
        # correctness property held somewhere else entirely. See ADR 027.
        if: always() && steps.smoke-liveness.outcome == 'failure'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const label = 'verification-dark'
            const title = 'Nothing is verifying production'
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`

            let diagnosis = 'The liveness probe produced no output.'
            try {
              const log = fs.readFileSync('smoke-liveness.log', 'utf-8').trim()
              if (log) diagnosis = ['```', log.slice(-3000), '```'].join('\n')
            } catch {
              // Fall through to the default — never invent a diagnosis from an absence.
            }

            const body = [
              'The production verification tier is dark: runs are completing, and the checks',
              'inside them are not executing.',
              '',
              diagnosis,
              '',
              '**This is not the same finding as "production smoke is failing."** That issue',
              'names a credential and is doing its job. This one names the consequence nobody',
              'was told about: while the preflight fails, every step after it reports',
              '`skipped`, and from outside a skipped job is indistinguishable from a passing',
              'one. The fabricated-catalogue detector and the photography check have not run',
              'in that window.',
              '',
              `Run: ${runUrl}`,
              '',
              'See `docs/adr/022-absence-needs-its-own-alarm.md`.',
            ].join('\n')

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            })

            // One issue, updated — never a new one per run. ADR 011: a channel that
            // repeats itself is a channel people mute, and this one has exactly one thing
            // to say until it is fixed.
            if (open.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              })
              return
            }

            const issue = open[0]
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100,
            })
            const last = comments[comments.length - 1]
            const withoutRun = (text) => text.replace(/Run: \S+/g, '').trim()
            if (last && withoutRun(last.body) === withoutRun(body)) return // nothing new to say

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body,
            })

      # And close it when the tier comes back, so the label means what it says.
      - name: Close the liveness issue on recovery
        # Same reasoning as the reporting step above, and the same ADR 027.
        if: always() && steps.smoke-liveness.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'verification-dark'
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            })
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'A production-smoke run has executed the live checks again. Closing.',
              })
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              })
            }

      # Is anything still gating what lands on main?
      #
      # Separate from ci.yml's own red X on purpose, and for the same reason smoke-liveness
      # is separate from production-smoke's. A failing gate has evaluated the code and
      # rejected it — that is the gate working, and the Actions tab already says so. This
      # asks the other question: has the gate evaluated anything at all? On 2026-08-29 the
      # answer was no for eleven consecutive runs and a full day, while eleven pull requests
      # merged by hand, because `Install dependencies` died and every check after it read
      # `skipped`. ADR 022 was written for exactly this and pointed at the other workflow.
      - name: Merge gate liveness — is CI still evaluating anything?
        id: ci-liveness
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/probe-ci-liveness.mjs 2>&1 | tee ci-liveness.log

      # Its own label, its own issue — the ADR 011 rule that a channel carrying two
      # different facts is a channel people learn to skip.
      - name: Report a dark merge gate
        # `always() &&` for the reason in ADR 027: an `if:` naming no status function has
        # `success()` ANDed onto it, which would make this alarm depend on every earlier
        # step having passed rather than on what it actually asks.
        if: always() && steps.ci-liveness.outcome == 'failure'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const label = 'merge-gate-dark'
            const title = 'Nothing is gating what lands on main'
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`

            let diagnosis = 'The liveness probe produced no output.'
            try {
              const log = fs.readFileSync('ci-liveness.log', 'utf-8').trim()
              if (log) diagnosis = ['```', log.slice(-3000), '```'].join('\n')
            } catch {
              // Fall through — never invent a diagnosis from an absence.
            }

            const body = [
              'CI runs on `main` are completing, and the checks inside them are not',
              'executing.',
              '',
              diagnosis,
              '',
              '**This is not the same finding as "CI is failing."** A failing gate has read',
              'the code and rejected it. This one says the gate has not read anything — so',
              'every merge in this window landed unverified, and the red X in the Actions',
              'tab names a cause (usually a dependency or setup failure) that stops people',
              'reading further.',
              '',
              `Run: ${runUrl}`,
              '',
              'See `docs/adr/022-absence-needs-its-own-alarm.md`.',
            ].join('\n')

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            })

            // One issue, updated — never one per run. ADR 011.
            if (open.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              })
              return
            }

            const issue = open[0]
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100,
            })
            const last = comments[comments.length - 1]
            const withoutRun = (text) => text.replace(/Run: \S+/g, '').trim()
            if (last && withoutRun(last.body) === withoutRun(body)) return // nothing new to say

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body,
            })

      # And close it when the gate comes back, so the label means what it says.
      - name: Close the merge-gate issue on recovery
        # Same reasoning as above, and the same ADR 027.
        if: always() && steps.ci-liveness.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'merge-gate-dark'
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            })
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'A CI run on main has evaluated the repository again. Closing.',
              })
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              })
            }

      - name: Canonical domain — is the brand domain bound to production?
        id: canonical-domain
        continue-on-error: true
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: node scripts/probe-canonical-domain.mjs 2>&1 | tee canonical-domain.log

      # Its own label and its own issue, per ADR 011: a channel carrying two different
      # facts is a channel people learn to skip.
      #
      # Keyed on the probe's own verdict rather than on the step outcome, because the
      # probe exits 0 for `unevaluable` on purpose — a runner that cannot reach the
      # public web must not file an issue claiming the domain broke.
      - name: Report an unbound canonical domain
        # `always() &&` for the reason in ADR 027: an `if:` naming no status function has
        # `success()` ANDed onto it, which would make this alarm depend on every earlier
        # step having passed rather than on what it actually asks.
        if: always() && steps.canonical-domain.outcome != 'skipped'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            // The decision lives in scripts/lib/canonical-domain.mjs, not here. This block
            // reads a file, lists issues, and applies what the decision returns — ADR 030,
            // and the budget this step failed at 64 lines before the extraction.
            //
            // GITHUB_WORKSPACE, because github-script resolves a bare specifier against the
            // action's own node_modules and has no repository path to resolve against.
            // Asserted in canonical-domain-decision.test.ts, because a typo here would
            // surface only in a scheduled job at 03:59 UTC.
            const fs = require('fs')
            const lib = `file://${process.env.GITHUB_WORKSPACE}/scripts/lib/canonical-domain.mjs`
            const { domainIssuePlan, DOMAIN_ISSUE_LABEL, DOMAIN_ISSUE_TITLE } = await import(lib)

            const repo = { owner: context.repo.owner, repo: context.repo.repo }
            const runUrl = `${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${context.runId}`

            let probe = null
            try {
              probe = JSON.parse(fs.readFileSync('canonical-domain.json', 'utf-8'))
            } catch {
              core.info('No canonical-domain.json — the probe produced no verdict.')
            }

            const { data: openIssues } = await github.rest.issues.listForRepo({
              ...repo,
              state: 'open',
              labels: DOMAIN_ISSUE_LABEL,
            })

            const plan = domainIssuePlan({ probe, openIssues, runUrl })

            for (const issue_number of plan.close) {
              await github.rest.issues.createComment({ ...repo, issue_number, body: plan.closeComment })
              await github.rest.issues.update({ ...repo, issue_number, state: 'closed' })
            }
            if (plan.update !== null) {
              await github.rest.issues.update({ ...repo, issue_number: plan.update, body: plan.body })
            }
            if (plan.create) {
              await github.rest.issues.create({
                ...repo,
                title: DOMAIN_ISSUE_TITLE,
                body: plan.body,
                labels: [DOMAIN_ISSUE_LABEL],
              })
            }

      # ─────────────────────────────────────────────────────────────────────────
      # Reports into the job summary and files no issue, deliberately.
      #
      # Run against production today this returns `findings` with 52 entries, every one of
      # them true: 17 products x 3 surviving commerce markers, plus /products/<unknown>
      # answering 200 rather than 404. Those belong to WS-5 and WS-4 of
      # docs/browse-only-masterplan.md, not to this audit.
      #
      # A six-hourly issue that cannot be closed for weeks is the shape ADR 011 records
      # costing this repository a month of unread escalations, so this reports a number and
      # nothing else until the replacement can pass. `continue-on-error` keeps its exit 1
      # from failing the audit; the issue-filing step and `status: configured` arrive
      # together, once a manual `pnpm verify:browse-only` comes back clean.
      #
      # No PRODUCTION_SITE_URL here: the probe reads the apex out of src/config/site.ts,
      # the same join probe-canonical-domain.mjs uses, so it cannot hold production to a
      # hostname the application has stopped believing in.
      - name: Browse-only catalogue — is the site serving what the repository holds?
        id: browse-only
        continue-on-error: true
        run: node scripts/verify-browse-only.mjs 2>&1 | tee browse-only.log

      - name: Audit summary
        if: always()
        run: |
          {
            echo "## Control audit"
            echo ""
            echo "| Control | Result |"
            echo "|---|---|"
            echo "| Merge gate (branch protection) | ${{ steps.merge-gate.outcome }} |"
            echo "| Assertion liveness (11 vitest sentinels) | ${{ steps.liveness.outcome }} |"
            echo "| Production verification liveness | ${{ steps.smoke-liveness.outcome }} |"
            echo "| Merge gate liveness (is CI evaluating?) | ${{ steps.ci-liveness.outcome }} |"
            echo "| Canonical domain bound to production | ${{ steps.canonical-domain.outcome }} |"
            echo "| Browse-only catalogue (reports only) | ${{ steps.browse-only.outcome }} |"
            echo ""
            for log in merge-gate liveness smoke-liveness ci-liveness canonical-domain browse-only; do
              if [ -s "$log.log" ]; then
                echo "<details><summary>$log</summary>"
                echo ""
                echo '```'
                cat "$log.log"
                echo '```'
                echo "</details>"
                echo ""
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
