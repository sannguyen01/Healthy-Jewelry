name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  quality:
    name: Lint · Type-check · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test
        env:
          SHOPIFY_STORE_DOMAIN: mock.myshopify.com
          SHOPIFY_STOREFRONT_ACCESS_TOKEN: mock_token
          NEXT_PUBLIC_SITE_URL: https://healthyjewelry.vn
