name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# A push supersedes the run already in flight for the same ref. PR #8 spent
# roughly 108 billable minutes across four pushes because every superseded run
# was allowed to finish a 24-minute E2E job nobody would read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Mock credentials — CI never talks to a real Shopify store. Declared once so
  # the two jobs cannot drift apart.
  #
  # NEXT_PUBLIC_SITE_URL is deliberately *not* here. The unit suite asserts the
  # production site constant (src/tests/unit/config.test.ts), while the build and
  # the E2E server need localhost — the same name legitimately means different
  # things per step, so each one sets it explicitly.
  SHOPIFY_STORE_DOMAIN: mock.myshopify.com
  SHOPIFY_STOREFRONT_ACCESS_TOKEN: mock_token
  NEXT_PUBLIC_SHOPIFY_STORE_DOMAIN: mock.myshopify.com
  SHOPIFY_WEBHOOK_SECRET: mock_webhook_secret
  # Set so the build's own configuration warning (src/lib/shopify/env-check.ts)
  # stays silent here. A CI log that always prints "Shopify is not fully
  # configured" trains everyone to ignore the one place that would catch a
  # genuinely unconfigured deploy.
  SHOPIFY_REVALIDATION_SECRET: mock_revalidation_secret

jobs:
  # The merge gate. Everything here is cheap and deterministic; if this is green
  # the change is safe to land, and E2E is confirmation rather than permission.
  verify:
    name: Lint · Type-check · Unit tests · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default depth-1 shallow clone.
          #
          # `audit-workflow-secrets.mjs` finds credentials whose workflow was deleted, so
          # it needs the commits where those deletions happened. On a shallow clone it saw
          # no deleted workflows, reported no orphans, and exited 0 — a false all-clear
          # from a security tool, while three real orphans sat in repository settings.
          #
          # The script now refuses outright rather than under-reporting, which is why this
          # has to be 0: without it the audit cannot run at all.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Unit tests
        run: pnpm exec vitest run
        env:
          NEXT_PUBLIC_SITE_URL: https://healthyjewellery.com

      # Next's incremental build cache. Restored before the build and *not*
      # shipped in the artifact below, so it speeds the build up without
      # changing a byte of what E2E tests. The key falls back to any cache built
      # from the same lockfile, so a source-only change still gets a warm start
      # rather than a cold rebuild.
      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # New. A broken production build used to be discovered by Vercel *after*
      # merge — `next build` catches prerender failures that neither tsc nor
      # vitest can see.
      #
      # Built for localhost because the E2E job serves this exact artifact.
      # NEXT_PUBLIC_* values are inlined at build time, so the URL baked in here
      # is the one the suite runs against.
      - name: Production build
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      # Handed to the E2E job so it exercises the exact artifact this gate
      # approved, and so the build is paid for once rather than twice.
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next
            !.next/cache
          retention-days: 1
          include-hidden-files: true

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next

      # Keyed on the Playwright version rather than the lockfile: browser
      # binaries only change when Playwright does, so keying on the whole
      # lockfile would throw away a perfectly good 130MB download every time an
      # unrelated dependency moved.
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      # The cache holds the browser but not the OS packages it links against,
      # and those live outside any cacheable path — so on a hit we still install
      # the system deps, which is the cheap half of the original step.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # PLAYWRIGHT_SKIP_BUILD tells playwright.config.ts to `pnpm start` the
      # artifact restored above instead of rebuilding it. The suite therefore
      # runs against a production server — what Vercel actually serves, and the
      # reason this job dropped from ~24 minutes to a few.
      - name: Run E2E tests
        run: pnpm e2e
        env:
          CI: true
          PLAYWRIGHT_SKIP_BUILD: '1'
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
