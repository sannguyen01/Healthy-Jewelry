name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# A push supersedes the run already in flight for the same ref. PR #8 spent
# roughly 108 billable minutes across four pushes because every superseded run
# was allowed to finish a 24-minute E2E job nobody would read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# GitHub's Linux default is `bash -e {0}`, which has **no `pipefail`** — so a
# piped step reports the exit status of the last command in the pipe rather than
# the one that matters. `production-smoke.yml` shipped two such steps and neither
# could fail; this workflow has none today and is one `| tee` away from the same
# hole. Declared at workflow scope so a future step inherits the fix instead of
# rediscovering the bug. See docs/adr/010-a-control-that-cannot-fail.md.
defaults:
  run:
    shell: bash

env:
  # Mock credentials — CI never talks to a real Shopify store. Declared once so
  # the two jobs cannot drift apart.
  #
  # NEXT_PUBLIC_SITE_URL is deliberately *not* here. The unit suite asserts the
  # production site constant (src/tests/unit/config.test.ts), while the build and
  # the E2E server need localhost — the same name legitimately means different
  # things per step, so each one sets it explicitly.
  SHOPIFY_STORE_DOMAIN: mock.myshopify.com
  SHOPIFY_STOREFRONT_ACCESS_TOKEN: mock_token
  NEXT_PUBLIC_SHOPIFY_STORE_DOMAIN: mock.myshopify.com
  SHOPIFY_WEBHOOK_SECRET: mock_webhook_secret
  # Set so the build's own configuration warning (src/lib/shopify/env-check.ts)
  # stays silent here. A CI log that always prints "Shopify is not fully
  # configured" trains everyone to ignore the one place that would catch a
  # genuinely unconfigured deploy.
  SHOPIFY_REVALIDATION_SECRET: mock_revalidation_secret

jobs:
  # The merge gate. Everything here is cheap and deterministic; if this is green
  # the change is safe to land, and E2E is confirmation rather than permission.
  verify:
    name: Lint · Type-check · Unit tests · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default depth-1 shallow clone.
          #
          # `audit-workflow-secrets.mjs` finds credentials whose workflow was deleted, so
          # it needs the commits where those deletions happened. On a shallow clone it saw
          # no deleted workflows, reported no orphans, and exited 0 — a false all-clear
          # from a security tool, while three real orphans sat in repository settings.
          #
          # The script now refuses outright rather than under-reporting, which is why this
          # has to be 0: without it the audit cannot run at all.
          fetch-depth: 0

      # No `version:`. pnpm/action-setup reads `packageManager` from package.json,
      # which is the single place this repository's pnpm version is declared.
      # Setting it here as well would let CI and dependabot resolve the lockfile
      # with different pnpm builds — how the `overrides:` block went missing.
      - uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      # The tool this job's `fetch-depth: 0` exists for.
      #
      # It was never invoked. Every CI run has been paying for a full-history clone —
      # with a comment above explaining that the auditor requires it — for a script
      # that ran nowhere, leaving the orphaned-credential audit to a line in
      # docs/credential-inventory.md reading "Last reconciled by hand".
      #
      # `continue-on-error`, deliberately. It exits 1 when orphans exist, and there
      # are three right now (VERCEL_TOKEN and its two identifiers), so a blocking
      # step would freeze every merge on a hygiene finding nobody can fix from a
      # pull request. Same trade as premise drift (ADR 008): report prominently,
      # never block. The findings go to the job summary so they are visible without
      # opening a log — a step whose output only lives in logs is a step nobody reads.
      - name: Audit workflow credentials
        id: secret-audit
        continue-on-error: true
        run: node scripts/audit-workflow-secrets.mjs 2>&1 | tee secret-audit.log

      - name: Credential audit summary
        if: always()
        run: |
          {
            echo "## Workflow credential audit"
            echo ""
            if [ "${{ steps.secret-audit.outcome }}" = "success" ]; then
              echo "No orphaned secrets."
            else
              echo "**Orphaned secrets found.** Deleting a workflow does not delete its"
              echo "secrets — they stay in repository settings with no expiry and nothing"
              echo "marking them unused. See \`docs/credential-inventory.md\`."
            fi
            echo ""
            echo '```'
            cat secret-audit.log 2>/dev/null || echo "(audit did not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Unit tests
        run: pnpm exec vitest run
        env:
          NEXT_PUBLIC_SITE_URL: https://healthyjewellery.com

      # Next's incremental build cache. Restored before the build and *not*
      # shipped in the artifact below, so it speeds the build up without
      # changing a byte of what E2E tests. The key falls back to any cache built
      # from the same lockfile, so a source-only change still gets a warm start
      # rather than a cold rebuild.
      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # New. A broken production build used to be discovered by Vercel *after*
      # merge — `next build` catches prerender failures that neither tsc nor
      # vitest can see.
      #
      # Built for localhost because the E2E job serves this exact artifact.
      # NEXT_PUBLIC_* values are inlined at build time, so the URL baked in here
      # is the one the suite runs against.
      - name: Production build
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      # Handed to the E2E job so it exercises the exact artifact this gate
      # approved, and so the build is paid for once rather than twice.
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next
            !.next/cache
          retention-days: 1
          include-hidden-files: true

  # A security advisory arriving bundled with an unrelated major bump is a real pattern
  # here, not a hypothetical: PR #60 proposed `next` 15.5.24 -> 16.3.3 to close two
  # Critical RCEs, and the framework major rode along. PR #61 caught it, patched the CVE
  # inside `next@15`, and declined the migration — correct, and dependent on a person
  # reading carefully while a Critical advisory pushed for a fast merge.
  #
  # Dependency-free on purpose, like the control-audit probes: no `pnpm install`, so this
  # cannot be broken by the very dependency change it is inspecting.
  #
  # **Known limit, stated rather than implied.** `main` has no branch protection, so a red
  # X here blocks nothing — anyone can still press merge. What this buys today is that a
  # bundled major is named at review time instead of noticed or not. It becomes a gate on
  # the day the merge gate does. See docs/adr/018.
  dependency-scope:
    name: Dependency scope
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # Both sides of the comparison have to be readable. A shallow clone has the head
          # and not the base, and this check would then compare the manifest to itself and
          # find nothing — a green that proves nothing, which is the failure mode the
          # workflow-secrets auditor already learned the hard way on this same flag.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Does this pull request smuggle a major bump?
        env:
          # Through the environment, never interpolated into the `run:` line. A pull
          # request description is text anyone can write, and
          # `${{ github.event.pull_request.body }}` inside a shell command is an injection
          # with a friendly name.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          node scripts/audit-dependency-scope.mjs \
            --base "origin/${{ github.base_ref }}" \
            --head "${{ github.event.pull_request.head.sha }}"

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      # No `version:`. pnpm/action-setup reads `packageManager` from package.json,
      # which is the single place this repository's pnpm version is declared.
      # Setting it here as well would let CI and dependabot resolve the lockfile
      # with different pnpm builds — how the `overrides:` block went missing.
      - uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next

      # Keyed on the Playwright version rather than the lockfile: browser
      # binaries only change when Playwright does, so keying on the whole
      # lockfile would throw away a perfectly good 130MB download every time an
      # unrelated dependency moved.
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      # The cache holds the browser but not the OS packages it links against,
      # and those live outside any cacheable path — so on a hit we still install
      # the system deps, which is the cheap half of the original step.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # PLAYWRIGHT_SKIP_BUILD tells playwright.config.ts to `pnpm start` the
      # artifact restored above instead of rebuilding it. The suite therefore
      # runs against a production server — what Vercel actually serves, and the
      # reason this job dropped from ~24 minutes to a few.
      - name: Run E2E tests
        run: pnpm e2e
        env:
          CI: true
          PLAYWRIGHT_SKIP_BUILD: '1'
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
