name: Production smoke

# Deliberately a separate workflow, not a job in ci.yml.
#
# `ci.yml` is the merge gate and must stay hermetic: it runs against
# `mock.myshopify.com` so it is fast, deterministic, and cannot be turned red by
# someone else's outage. This workflow is the opposite by design — it talks to
# the real store and the real deployment, so it is allowed to fail for reasons
# that have nothing to do with the commit under review.
#
# Keeping them apart is the point. Branch protection requires `verify` and
# `e2e`; it must never require this one, or a Shopify incident becomes a merge
# freeze.
#
# ─────────────────────────────────────────────────────────────────────────────
# THIS WORKFLOW CANNOT RUN UNTIL IT IS ON THE DEFAULT BRANCH.
#
# Scheduled runs execute only from the default branch, and `workflow_dispatch`
# needs the file there before the "Run workflow" button appears. While this
# lives only on a feature branch it is not failing — it does not exist as far as
# the Actions API is concerned. That is a merge-order fact, not a
# misconfiguration.
# ─────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
  schedule:
    # Every 6 hours. This repository is **public**, so Actions minutes are not
    # billed and the cost argument that keeps `ci.yml` lean does not apply here.
    # Drift between deploys is exactly what this tier exists to catch: all three
    # of this project's commerce outages happened while nobody was pushing.
    - cron: '0 */6 * * *'

# A manual run should supersede a scheduled one already in flight rather than
# racing it against the same store.
concurrency:
  group: production-smoke
  cancel-in-progress: true

# Only what the failure-notification step needs. `contents: read` is the default
# for everything else; nothing here writes to the repository.
permissions:
  contents: read
  issues: write

# ─────────────────────────────────────────────────────────────────────────────
# `shell: bash`, and the reason it is not cosmetic.
#
# GitHub's default shell on Linux is `bash -e {0}` — **no `pipefail`**. A
# pipeline's exit status is its *last* command's, so `node script.mjs | tee x.log`
# reports `tee`'s status, and `tee` always succeeds.
#
# Both real checks in this workflow are piped. Neither could fail. Run
# 31600442658 printed `| Webhook signing secret | success |` for a script that
# emitted a usage error and exited 2 — and once the secrets are configured the
# preflight stops being the one step able to go red, at which point this workflow
# would have been permanently green regardless of what production did, while its
# `if: success()` step closed the failure issue saying "recovered".
#
# `shell: bash` is GitHub's own opt-in to `bash --noprofile --norc -eo pipefail`.
# Declared here rather than on the two offending steps so that steps nobody has
# written yet inherit it. See docs/adr/010-a-control-that-cannot-fail.md.
# ─────────────────────────────────────────────────────────────────────────────
defaults:
  run:
    shell: bash

jobs:
  smoke:
    name: Verify the live store and deployment
    runs-on: ubuntu-latest
    # Environment-scoped secrets, not repository secrets.
    #
    # This repository is public and forkable, so an environment is the boundary
    # that can carry required reviewers and a branch allowlist.
    #
    # BUT this key is not, by itself, a control:
    #
    #   · Naming an environment that does not exist does NOT fail. GitHub
    #     creates it automatically, with no protection rules and no secrets.
    #   · A job with an `environment:` key still receives REPOSITORY secrets.
    #
    # So five repo-scoped secrets would turn this green with zero isolation and
    # no signal anywhere. The preflight step below is what makes the difference
    # observable. See docs/adr/006-controls-must-fail-loudly.md.
    environment: production-readonly
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      # No `pnpm install`. Every script here is dependency-free and uses Node
      # 22's global fetch and node:crypto, so this job needs no lockfile, no
      # cache, and no build — which is also why it cannot be broken by a
      # dependency change the merge gate has not seen yet.

      # One message naming everything that is missing, before any request goes
      # out. Without this, `required()` inside verify-production.mjs throws on
      # the first absent variable, so configuring from scratch costs five
      # sequential red runs to learn five facts knowable up front.
      #
      # It also asserts SMOKE_SECRETS_SOURCE, which is set only on the
      # environment — the marker that distinguishes "isolated" from "green but
      # sourced from repository scope".
      #
      # Three states, not two. `configured=false` means *nothing* is set — nobody
      # has done the setup, which is a known fact rather than news, and filing an
      # issue about it every six hours trains the reader to mute the one channel
      # that will later carry a real outage. *Partial* configuration stays a hard
      # failure: that is what a botched setup looks like, and it is the state most
      # easily mistaken for a working one.
      - name: Preflight — secrets present and environment-scoped
        id: preflight
        env:
          PRODUCTION_SITE_URL: ${{ secrets.PRODUCTION_SITE_URL }}
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_STOREFRONT_ACCESS_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_ACCESS_TOKEN }}
          SHOPIFY_ADMIN_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ADMIN_ACCESS_TOKEN }}
          SHOPIFY_WEBHOOK_SECRET: ${{ secrets.SHOPIFY_WEBHOOK_SECRET }}
          SMOKE_SECRETS_SOURCE: ${{ vars.SMOKE_SECRETS_SOURCE }}
        run: |
          node scripts/preflight-secrets.mjs \
            PRODUCTION_SITE_URL \
            SHOPIFY_STORE_DOMAIN \
            SHOPIFY_STOREFRONT_ACCESS_TOKEN \
            SHOPIFY_ADMIN_ACCESS_TOKEN \
            SHOPIFY_WEBHOOK_SECRET \
            2>&1 | tee preflight.log

      # Catalogue, publishing scope, the real cart → checkoutUrl path, metadata,
      # search, rate-limit durability, and cache revalidation.
      # Runs every check even when one fails, so a run reports the whole picture.
      # `always()` is load-bearing, and its absence cost fourteen days of verification.
      #
      # An `if:` that names no status function has `success()` implicitly ANDed onto it by
      # GitHub. So while this read `if: steps.preflight.outputs.configured == 'true'`, a
      # *failed preflight* skipped it — even though `configured` was 'true' the whole time.
      #
      # The preflight failed because SHOPIFY_ADMIN_ACCESS_TOKEN held the wrong kind of token.
      # This step needs PRODUCTION_SITE_URL, SHOPIFY_STORE_DOMAIN and the *Storefront* token;
      # it never reads the Admin one. Twelve of its seventeen checks — including "Live site
      # serves Shopify data, not the static fallback", the only thing between customers and a
      # catalogue whose variant IDs Shopify rejects at checkout — were skipped for a
      # credential they do not use.
      #
      # `storefrontReady` says whether *this step's own* credentials are present and
      # well-formed. The preflight's verdict is unchanged and still fails the run.
      # See docs/adr/026-a-capability-is-not-a-verdict.md.
      - name: Live store and storefront
        id: storefront
        if: always() && steps.preflight.outputs.storefrontReady == 'true'
        env:
          PRODUCTION_SITE_URL: ${{ secrets.PRODUCTION_SITE_URL }}
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_STOREFRONT_ACCESS_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_ACCESS_TOKEN }}
          SHOPIFY_ADMIN_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ADMIN_ACCESS_TOKEN }}
          SHOPIFY_WEBHOOK_SECRET: ${{ secrets.SHOPIFY_WEBHOOK_SECRET }}
        run: node scripts/verify-production.mjs | tee storefront.log

      # Separate step, and `if: always()`, because the webhook secret is an
      # independent question. A catalogue problem should not hide a secret
      # problem — that pairing is how the original outage stayed undiagnosed.
      - name: Webhook signing secret
        id: webhook
        # `always()` keeps the original intent — a catalogue failure must not hide
        # a secret failure — while the two added clauses stop it running when
        # there is nothing to verify or when the preflight itself already said
        # what is wrong. Before this it ran with no secrets at all, printed a
        # usage error, and (through the pipefail bug) reported success.
        # Same correction as the storefront step above. `steps.preflight.outcome == 'success'`
        # made this conditional on the *whole* setup being valid, so a wrong Admin token
        # skipped a probe that signs a payload with SHOPIFY_WEBHOOK_SECRET and lets the
        # deployed route judge it — no Admin API involved. `webhookReady` names what this
        # step actually needs. The original intent is preserved: a catalogue failure must
        # not hide a secret failure, which is why this still runs independently of the
        # storefront step's result.
        if: always() && steps.preflight.outputs.webhookReady == 'true'
        env:
          PRODUCTION_SITE_URL: ${{ secrets.PRODUCTION_SITE_URL }}
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_WEBHOOK_SECRET: ${{ secrets.SHOPIFY_WEBHOOK_SECRET }}
        run: node scripts/verify-webhook-secret.mjs | tee webhook.log

      # A machine-readable record of which checks actually executed.
      #
      # Until 2026-08-28 the only record was the markdown table below, which nothing can
      # query. That mattered: every run since 2026-08-15 has failed at the preflight, so
      # `storefront` and `webhook` have reported `skipped` thirty-plus times in a row —
      # and from outside a skipped step is indistinguishable from a passing one. The
      # fabricated-catalogue detector and the photography check have been dark that whole
      # time with nothing saying so.
      #
      # `scripts/probe-smoke-liveness.mjs` reads step conclusions from the Actions API, so
      # this receipt is not what it depends on. It is here for a human opening the run,
      # and as the artifact a future check can read without the API.
      - name: Write the run receipt
        if: always()
        run: |
          cat > smoke-receipt.json <<JSON
          {
            "run": "${{ github.run_id }}",
            "completedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "checks": {
              "preflight": "${{ steps.preflight.outcome }}",
              "storefront": "${{ steps.storefront.outcome }}",
              "webhook": "${{ steps.webhook.outcome }}"
            },
            "configured": "${{ steps.preflight.outputs.configured }}",
            "capabilities": {
              "storefront": "${{ steps.preflight.outputs.storefrontReady }}",
              "webhook": "${{ steps.preflight.outputs.webhookReady }}"
            }
          }
          JSON
          cat smoke-receipt.json

      - name: Upload the run receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-receipt
          path: smoke-receipt.json
          retention-days: 30

      # A readable verdict in the Actions tab without opening logs.
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Production smoke"
            echo ""
            if [ "${{ steps.preflight.outputs.configured }}" != "true" ]; then
              echo "**Not configured for live verification.** No secrets are set on the"
              echo "\`production-readonly\` environment, so this run had nothing to check."
              echo "It is not a failure and no issue was filed."
              echo ""
            fi

            # The verdict as a sentence, before the table.
            #
            # "A job reporting skipped reads exactly like a job reporting passed" is true
            # of a table and false of a sentence. A reader scanning three rows of `skipped`
            # sees three rows; a reader shown "2 of 3 checks did not execute" sees the
            # finding. Same data, and only one of them is read.
            did_not_run=0
            for outcome in "${{ steps.storefront.outcome }}" "${{ steps.webhook.outcome }}"; do
              case "$outcome" in success|failure) ;; *) did_not_run=$((did_not_run + 1)) ;; esac
            done
            if [ "$did_not_run" -gt 0 ] && [ "${{ steps.preflight.outputs.configured }}" = "true" ]; then
              echo "> ⚠ **$did_not_run of 2 live checks did not execute.** A check is skipped"
              echo "> only when its own credentials are missing or malformed — not because"
              echo "> some other secret is wrong. Storefront ready:"
              echo "> \`${{ steps.preflight.outputs.storefrontReady }}\`, webhook ready:"
              echo "> \`${{ steps.preflight.outputs.webhookReady }}\`. See the preflight below."
              echo ""
            fi

            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Secrets preflight | ${{ steps.preflight.outcome }} (${{ steps.preflight.outputs.state }}) |"
            echo "| Live store and storefront | ${{ steps.storefront.outcome }} |"
            echo "| Webhook signing secret | ${{ steps.webhook.outcome }} |"
            echo ""
            # Every log, not just the storefront's. The run that prompted this had
            # its whole answer in the preflight output and published none of it.
            for log in preflight storefront webhook; do
              if [ -s "$log.log" ]; then
                echo "<details><summary>$log</summary>"
                echo ""
                echo '```'
                cat "$log.log"
                echo '```'
                echo "</details>"
                echo ""
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # A non-blocking scheduled job that nobody watches will rot silently: it is
      # excluded from branch protection on purpose, so a failure surfaces nowhere
      # unless someone happens to open the Actions tab. An issue is the one
      # channel that reaches a human by default — GitHub emails on issue
      # activity — and it needs no new credential.
      #
      # `continue-on-error` because a notification problem must never mask a
      # smoke result or manufacture one.
      #
      # Gated on `configured` so a store nobody has set up yet cannot generate a
      # six-hourly "Still failing" comment about a fact its owner already knows.
      # Partial configuration is still a failure and still files — that is the
      # state most easily mistaken for a working one.
      #
      # Dedup + escalate, not just comment (ADR 011).
      #
      # ──────────────────────────────────────────────────────────────────────
      # THE DECISION IS NOT HERE. It is `scripts/lib/escalation.mjs`.
      #
      # It used to be here: ~110 lines of JavaScript inside this YAML string,
      # deciding whether a production failure reaches a person. It had no tests
      # and could not have had any — a function in a string literal is not
      # importable, so the only way to exercise it was to break production and
      # wait six hours for the next scheduled run.
      #
      # It was broken the whole time, in three independent ways.
      #
      # ONE. The comparison that answers "is this the same failure as last
      # time?" read the raw tail of each step's log, and the storefront log
      # carries a figure measured on that run:
      #
      #     ✓ Open Graph image renders within the crawler budget
      #       176ms cold, 17KB (budget 2500ms)
      #
      # Nine consecutive comments on issue #24 read 176, 99, 145, 106, 186,
      # 129, 209, 137, 194. Two identical failures therefore never compared
      # equal, the streak never left 1, and the escalation branch was
      # unreachable from the day it was written. #24 reached 100 comments over
      # ~124 runs and escalated zero times — the "channel people mute" ADR 011
      # exists to prevent, wearing ADR 011's own fix.
      #
      # TWO, eleven lines from the first: the streak counted trailing identical
      # comments, while the same branch suppressed the comment whenever the
      # diagnosis was identical. The count could never exceed the one comment
      # that had been let through, so `streak < 3` held forever even for a
      # diagnosis that never moved. The counter now lives in the standing
      # comment and the quiet path edits it in place — GitHub sends no mail for
      # an edit, so "quiet" still means quiet, and the threshold is reachable.
      #
      # THREE. `listComments({ per_page: 100 })` with no pagination, then
      # `comments[comments.length - 1]`. GitHub returns page one, so past a
      # hundred comments "the last comment" is the hundredth *oldest* and the
      # diagnosis is compared against a month-old one forever. #24 sat at
      # exactly 100 comments when this was rewritten, one short of the cliff.
      #
      # What remains below is a transport: read the logs, call the decision,
      # apply whatever it hands back. It composes no sentence of its own,
      # because a sentence inside a YAML string literal is a sentence no test
      # can read — and that is how a hundred of them came to be written. Every
      # branch above is now a case in `src/tests/unit/escalation-decision.test.ts`.
      # See docs/adr/030-an-equivalence-relation-is-the-control.md.
      # ──────────────────────────────────────────────────────────────────────
      - name: Report failure as an issue
        if: failure() && steps.preflight.outputs.configured == 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            // Absolute, and a file: URL. github-script evaluates this block through
            // `new AsyncFunction`, where a relative specifier has no referrer module to
            // resolve against. Asserted in escalation-decision.test.ts, because a typo
            // here would surface at 03:59 UTC in a scheduled job and nowhere else.
            const lib = `file://${process.env.GITHUB_WORKSPACE}/scripts/lib/escalation.mjs`
            const { SMOKE_LABEL, composeDiagnosis, escalationDecision } = await import(lib)

            const repo = { owner: context.repo.owner, repo: context.repo.repo }
            const runUrl = `${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${context.runId}`

            const read = (name) => {
              try { return { name, text: fs.readFileSync(`${name}.log`, 'utf-8') } } catch { return null }
            }
            const logs = ['preflight', 'storefront', 'webhook'].map(read).filter(Boolean)

            const { data: open } = await github.rest.issues.listForRepo({ ...repo, state: 'open', labels: SMOKE_LABEL })
            const issue = open[0] ?? null
            // paginate, not per_page. See THREE above.
            const comments = issue
              ? await github.paginate(github.rest.issues.listComments, { ...repo, issue_number: issue.number, per_page: 100 })
              : []

            const decision = escalationDecision({
              issue, comments, diagnosis: composeDiagnosis(logs), labels: issue?.labels ?? [], runUrl,
            })
            core.info(`${decision.action}: ${decision.reason}`)

            if (decision.action === 'create') {
              await github.rest.issues.create({ ...repo, title: decision.title, body: decision.body, labels: decision.labels })
              return
            }

            const issue_number = issue.number
            if (decision.refresh) {
              await github.rest.issues.updateComment({ ...repo, comment_id: decision.refresh.commentId, body: decision.refresh.body })
            }
            if (decision.issueUpdate) {
              await github.rest.issues.update({ ...repo, issue_number, ...decision.issueUpdate })
            }
            if (decision.body) {
              await github.rest.issues.createComment({ ...repo, issue_number, body: decision.body })
            }

      # Premise drift is reported separately from failure, and never as failure.
      #
      # A drifted premise means a recorded decision has gone stale — a Vietnamese locale
      # appearing, a collection added in Shopify — not that the storefront is broken. Some
      # of it is opportunity. Turning the run red for opportunity is how the 24-minute E2E
      # suite became noise nobody read, so this gets its own label and its own issue.
      #
      # `if: always()` because drift is worth knowing about even on a run that failed for
      # unrelated reasons, and `continue-on-error` so a notification problem can never
      # manufacture or mask a smoke result.
      - name: Report premise drift
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const label = 'premise-drift'
            let drifted = []
            try {
              drifted = JSON.parse(fs.readFileSync('premise-drift.json', 'utf-8'))
            } catch {
              // No file means premises could not be evaluated — the run's own failure
              // reporting covers that; do not invent a drift issue from its absence.
              return
            }

            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            })

            if (drifted.length === 0) {
              for (const issue of open) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `All premises hold again.\n\nRun: ${runUrl}`,
                })
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                })
              }
              return
            }

            const body = [
              'A premise behind a recorded decision no longer holds.',
              '',
              '**This is not an outage.** These are decisions worth revisiting, or',
              'assumptions that have expired — see `docs/adr/008-decisions-need-premise-detectors.md`.',
              '',
              ...drifted.map((d) => `- **${d.id}** (${d.kind}) — ${d.detail}\n  _Decision: ${d.decision}_`),
              '',
              `Run: ${runUrl}`,
            ].join('\n')

            if (open.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Premise drift: a recorded decision has gone stale',
                body,
                labels: [label],
              })
            }

      # Closing on recovery is what keeps the issue meaningful. An alert that
      # only ever opens becomes a list nobody reads.
      #
      # `configured` is not optional here. A not-configured run *succeeds* — it has
      # nothing to check — so without this gate it would close an open failure
      # issue and comment "recovered" having verified precisely nothing. Combined
      # with the pipefail bug (ADR 010) that is how a broken store would have
      # retracted its own alarm.
      - name: Close the failure issue on recovery
        if: success() && steps.preflight.outputs.configured == 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'production-smoke'
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            })

            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Recovered — production smoke passed.\n\nRun: ${runUrl}`,
              })
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              })
            }

# No step echoes a secret, interpolates one into a `run:` string, or writes one
# to a file. Every secret reaches a script through `env:`, where the runner's log
# masking applies. Interpolating a secret directly into a `run:` command line
# would place the value there before masking sees it — which is exactly what the
# deleted deploy-production.yml did with the Vercel token.
