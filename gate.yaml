# Machine-readable safety policy for this repo's loops. Mirrors loop-constraints.md
# and the four hard gates in ~/.claude/loop/README.md.
#
# SCOPE: this governs *unattended loop* edits only. It is not a claim that these
# paths are frozen — .github/workflows and next.config.ts are actively
# maintained by humans (see PRs #9 and #10, which rebuilt CI). The rule is that
# an autonomous run must escalate rather than touch them on its own.
version: 1

denylist:
  - ".env"
  - ".env.*"
  - "**/secrets/**"
  - "**/credentials/**"
  - "**/*_key*"
  - "**/*_secret*"
  - ".vercel/**"
  - "**/migrations/**"
  - ".github/workflows/**"
  # Was `src/lib/shopify/**`, until WS-A deletes it. Denying a loop from editing a
  # directory that is scheduled to disappear protects nothing; what needs protecting is
  # the boundary that replaced it. A weakening edit here is invisible in review — it looks
  # like tidying — which is why it is a human action rather than an autonomous one.
  - "COMMERCE-ELIMINATION-CONTRACT.md"
  - "docs/commerce-dependency-register.md"
  - "next.config.ts"
  # Holds `buildCommand`, and is where any future deploy gate (an `ignoreCommand`)
  # would live. `.vercel/**` above covers only the gitignored local link directory,
  # so this file sat unprotected beside next.config.ts. See docs/adr/015.
  - "vercel.json"

maxFiles: 10

# At L1 nothing is auto-merged (no fix phase runs), so this is empty on purpose.
autoMergeAllowlist: []
